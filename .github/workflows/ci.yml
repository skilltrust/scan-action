name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/run-tests.sh

  # Parse coverage for every scripts/*.ps1. report.ps1 shipped a ParserError
  # for three releases because the Windows smoke legs pass comment: 'false' and
  # never reached it; this job catches that whole class regardless of which
  # halves get executed. It runs on ubuntu — GitHub's ubuntu runners ship
  # PowerShell 7, so no Windows runner and no Docker are needed.
  # Parsing is not executing: the execution coverage lives in pwsh-exec-delta
  # (delta.ps1), the Windows smoke legs (install/scan/telemetry.ps1) and
  # smoke-pr-comment-windows (render-comment.ps1, report.ps1).
  pwsh-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fail loudly if the preinstalled-pwsh assumption ever stops holding,
      # rather than let the harness below quietly fall back to Docker.
      - run: pwsh --version
      - name: Parse every scripts/*.ps1
        run: ./tests/pwsh/parse-all-ps1.sh

  pwsh-exec-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pwsh --version
      - name: Execute delta.ps1 against fake binaries
        run: ./tests/pwsh/exec-delta-ps1.sh
      - name: Execute reporting PowerShell against fake GitHub API
        run: ./tests/pwsh/exec-reporting-ps1.sh
      - name: Execute installer PowerShell against exact local release fixtures
        run: ./tests/pwsh/exec-install-ps1.sh
      - name: Execute telemetry PowerShell against local capture
        run: ./tests/pwsh/exec-telemetry-ps1.sh

  m3-local-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux composite-equivalent policy and output matrix
        run: ./tests/e2e/local-composite-equivalent.sh
      - name: Independently copy and validate README candidate
        run: ./tests/e2e/readme-candidate.sh

  # Synthetic policy matrix still enters through the composite (`uses: ./`).
  # It substitutes only installation, allowing deterministic detector exits
  # that the real binary cannot naturally produce (notably unknown exit 42).
  # The real installer has separate exact-release fixtures and the supported
  # hosted matrix below exercises it without substitution.
  m3-composite-policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: clean, exit: 0, report: 'false', warn: 'true', no_surface: 'false', fail_empty: 'false', expected: success, valid: 'true' }
          - { case: below-default, exit: 1, report: 'false', warn: 'true', no_surface: 'false', fail_empty: 'false', expected: success, valid: 'true' }
          - { case: below-legacy, exit: 1, report: 'false', warn: 'false', no_surface: 'false', fail_empty: 'false', expected: failure, valid: 'true' }
          - { case: below-report, exit: 1, report: 'true', warn: 'false', no_surface: 'false', fail_empty: 'false', expected: success, valid: 'true' }
          - { case: critical, exit: 2, report: 'false', warn: 'true', no_surface: 'false', fail_empty: 'false', expected: failure, valid: 'true' }
          - { case: critical-report, exit: 2, report: 'true', warn: 'true', no_surface: 'false', fail_empty: 'false', expected: success, valid: 'true' }
          - { case: axis-equal, exit: axis, axis: 'security=D', report: 'false', warn: 'true', no_surface: 'false', fail_empty: 'false', expected: success, valid: 'true' }
          - { case: axis-strict-worse, exit: axis, axis: 'security=C', report: 'false', warn: 'true', no_surface: 'false', fail_empty: 'false', expected: failure, valid: 'true' }
          - { case: empty-warn, exit: 0, report: 'false', warn: 'true', no_surface: 'true', fail_empty: 'false', expected: success, valid: 'true' }
          - { case: empty-gate, exit: 0, report: 'true', warn: 'true', no_surface: 'true', fail_empty: 'true', expected: failure, valid: 'true' }
          - { case: tool-error, exit: 3, report: 'true', warn: 'true', no_surface: 'false', fail_empty: 'false', expected: failure, valid: 'false' }
          - { case: unknown, exit: 42, report: 'true', warn: 'true', no_surface: 'false', fail_empty: 'false', expected: failure, valid: 'false' }
    steps:
      - uses: actions/checkout@v7
      - name: Substitute deterministic detector installation
        shell: bash
        run: |
          cat > scripts/install.sh <<'INSTALL'
          #!/usr/bin/env bash
          set -euo pipefail
          dest="$RUNNER_TEMP/skill-detector-install"
          mkdir -p "$dest"
          cp "$GITHUB_ACTION_PATH/tests/e2e/m3-fake-detector.sh" "$dest/skill-detector"
          chmod +x "$dest/skill-detector"
          echo "$dest" >> "$GITHUB_PATH"
          echo "SCAN_ACTION_DETECTOR_DIR=$dest" >> "$GITHUB_ENV"
          INSTALL
          chmod +x scripts/install.sh
      - id: action
        continue-on-error: true
        uses: ./
        env:
          M3_FAKE_EXIT: ${{ matrix.exit }}
          M3_FAKE_NO_SURFACE: ${{ matrix.no_surface }}
        with:
          path: tests/fixtures/difficult path ñ
          report-only: ${{ matrix.report }}
          fail-on-axis: ${{ matrix.axis }}
          warn-on-below-threshold: ${{ matrix.warn }}
          fail-on-no-agent-surface: ${{ matrix.fail_empty }}
          comment: 'false'
          delta: 'false'
          telemetry: 'false'
      - name: Consume all outputs and assert policy
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXPECTED: ${{ matrix.expected }}
          VALID: ${{ matrix.valid }}
          GRADE: ${{ steps.action.outputs.grade }}
          JSON_PATH: ${{ steps.action.outputs.scan-json-path }}
          COUNT: ${{ steps.action.outputs.findings-count }}
          NO_SURFACE: ${{ steps.action.outputs.no-agent-surface }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "$EXPECTED" ]
          if [ "$VALID" = true ]; then
            jq -e '.complete_marker == "kept"' "$JSON_PATH"
            [ -n "$COUNT" ]
            [ -n "$NO_SURFACE" ]
            if [ "$NO_SURFACE" = true ]; then [ -z "$GRADE" ]; else [[ "$GRADE" =~ ^[ABCDF]$ ]]; fi
          else
            [ -z "$GRADE$JSON_PATH$COUNT$NO_SURFACE" ]
          fi

  # Actual composite coverage. Every invocation below is `uses: ./`; script
  # unit tests are not accepted as a substitute for this matrix. Telemetry and
  # comments are disabled so synthetic checks have no network side effects.
  m3-composite-supported:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: clean
        uses: ./
        with:
          path: tests/fixtures/difficult path ñ
          comment: 'false'
          telemetry: 'false'
      - name: Consume clean outputs and complete JSON
        shell: bash
        env:
          GRADE: ${{ steps.clean.outputs.grade }}
          JSON_PATH: ${{ steps.clean.outputs.scan-json-path }}
          COUNT: ${{ steps.clean.outputs.findings-count }}
          NO_SURFACE: ${{ steps.clean.outputs.no-agent-surface }}
        run: |
          set -euo pipefail
          [[ "$GRADE" =~ ^[ABCDF]$ ]]
          [ "$COUNT" -eq 0 ]
          [ "$NO_SURFACE" = false ]
          jq -e '.findings | length == 0' "$JSON_PATH"
      - id: findings
        uses: ./
        with:
          path: tests/fixtures/critical-repo
          report-only: 'true'
          comment: 'false'
          telemetry: 'false'
      - name: Consume findings outputs and complete JSON
        shell: bash
        env:
          GRADE: ${{ steps.findings.outputs.grade }}
          JSON_PATH: ${{ steps.findings.outputs.scan-json-path }}
          COUNT: ${{ steps.findings.outputs.findings-count }}
          NO_SURFACE: ${{ steps.findings.outputs.no-agent-surface }}
        run: |
          set -euo pipefail
          [[ "$GRADE" =~ ^[ABCDF]$ ]]
          [ "$COUNT" -gt 0 ]
          [ "$NO_SURFACE" = false ]
          [ "$(jq '.findings | length' "$JSON_PATH")" -eq "$COUNT" ]
      - name: Preserve complete expected-block JSON as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: m3-report-only-${{ matrix.os }}
          path: ${{ steps.findings.outputs.scan-json-path }}
      - id: empty
        uses: ./
        with:
          path: tests/fixtures/empty-repo
          comment: 'false'
          telemetry: 'false'
      - name: Consume no-surface outputs and complete JSON
        shell: bash
        env:
          GRADE: ${{ steps.empty.outputs.grade }}
          JSON_PATH: ${{ steps.empty.outputs.scan-json-path }}
          COUNT: ${{ steps.empty.outputs.findings-count }}
          NO_SURFACE: ${{ steps.empty.outputs.no-agent-surface }}
        run: |
          set -euo pipefail
          [ -z "$GRADE" ]
          [ "$COUNT" -eq 0 ]
          [ "$NO_SURFACE" = true ]
          jq -e '.no_agent_surface == true and (.findings | length == 0)' "$JSON_PATH"
      - id: error
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/does-not-exist
          report-only: 'true'
          comment: 'false'
          telemetry: 'false'
      - name: Operational failure is not report-only success
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.error.outcome }}
          GRADE: ${{ steps.error.outputs.grade }}
          JSON_PATH: ${{ steps.error.outputs.scan-json-path }}
          COUNT: ${{ steps.error.outputs.findings-count }}
          NO_SURFACE: ${{ steps.error.outputs.no-agent-surface }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = failure ]
          [ -z "$GRADE$JSON_PATH$COUNT$NO_SURFACE" ]

  # Detector v0.11.0 Codex config regression through the real composite on
  # every supported runner. This is separate from m3-composite-supported: that
  # matrix pins the general install/scan/output/error contract, while this one
  # pins Codex TOML diagnostics, SD-026, and rendered warnings.
  codex-composite-v011:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        case: [clean, danger, malformed, timeout]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: action
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/codex-${{ matrix.case }}
          fail-on: high
          report-only: ${{ (matrix.case == 'malformed' || matrix.case == 'timeout') && 'true' || 'false' }}
          comment: 'false'
          delta: 'false'
          telemetry: 'false'
      - name: Assert Codex scan, diagnostics, rendering, and policy
        if: always()
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          OUTCOME: ${{ steps.action.outcome }}
          GRADE: ${{ steps.action.outputs.grade }}
          JSON_PATH: ${{ steps.action.outputs.scan-json-path }}
          COUNT: ${{ steps.action.outputs.findings-count }}
          NO_SURFACE: ${{ steps.action.outputs.no-agent-surface }}
        run: |
          set -euo pipefail
          case "$CASE" in
            clean)
              [ "$OUTCOME" = success ]
              [ "$COUNT" -eq 0 ]
              [ "$NO_SURFACE" = false ]
              [[ "$GRADE" =~ ^[ABCDF]$ ]]
              jq -e '
                (.findings | length) == 0 and
                (.warnings | length) == 3 and
                ([.warnings[] | select(contains("Codex declaration-only analysis"))] | length) == 2 and
                ([.warnings[] | select(contains("named profile file is only active"))] | length) == 1
              ' "$JSON_PATH"
              [ "$(head -n 1 "$RUNNER_TEMP/comment.md")" = '<!-- skilltrust:action:v1 -->' ]
              for report in "$RUNNER_TEMP/comment.md"; do
                grep -qF '### Warnings' "$report"
                grep -qF 'Codex declaration\-only analysis' "$report"
                grep -qF 'named profile file is only active' "$report"
              done
              ;;
            danger)
              [ "$OUTCOME" = failure ]
              [ "$COUNT" -eq 1 ]
              [ "$NO_SURFACE" = false ]
              [[ "$GRADE" =~ ^[ABCDF]$ ]]
              jq -e '(.findings | length) == 1 and .findings[0].rule_id == "SD-026"' "$JSON_PATH"
              grep -qF 'SD\-026' "$RUNNER_TEMP/comment.md"
              ;;
            malformed|timeout)
              [ "$OUTCOME" = failure ]
              [ -z "$GRADE$JSON_PATH$COUNT$NO_SURFACE" ]
              [ ! -e "$RUNNER_TEMP/comment.md" ]
              ;;
          esac
          python3 - <<'PY'
          import os
          from pathlib import Path
          # GitHub gives each composite step a different summary file.
          summaries = [p.read_text(encoding="utf-8") for p in
                       Path(os.environ["GITHUB_STEP_SUMMARY"]).parent.glob("step_summary_*")]
          if os.environ["CASE"] == "clean":
              assert any("### Warnings" in s and r"Codex declaration\-only analysis" in s
                         and "named profile file is only active" in s for s in summaries)
          elif os.environ["CASE"] == "danger":
              assert any(r"SD\-026" in s for s in summaries)
          PY

  # The four gate-default verification cases against the REAL engine. bats runs
  # against a fake detector that returns whatever exit code the test hands it,
  # so it can prove the plumbing and never that one-high-repo actually yields
  # one HIGH finding. The harness reads the thresholds out of action.yml, so it
  # fails if the DEFAULT regresses and not only if a script does.
  e2e-gate-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the engine version action.yml pins
        run: |
          set -euo pipefail
          ver=$(awk '
            $0 == "  detector-version:" { inb = 1; next }
            inb && /^  [a-z][a-z0-9-]*:$/ { inb = 0 }
            inb && /^    default:/ { sub(/^    default:[ \t]*/, ""); print; exit }
          ' action.yml | tr -d "'\"")
          if [ -z "$ver" ]; then
            echo "could not read detector-version from action.yml" >&2
            exit 1
          fi
          echo "pinned engine: $ver"
          INPUT_DETECTOR_VERSION="$ver" ./scripts/install.sh
      - name: The gate-default verification cases, real engine
        run: ./tests/e2e/gate-defaults.sh

  smoke-clean:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          path: tests/fixtures/clean-repo
          fail-on: high
          # This job tests scanning, not commenting. On a pull_request event the
          # comment steps would otherwise run without `pull-requests: write` and
          # 403 — and would race the dedicated comment jobs for the marker.
          comment: 'false'
          telemetry: 'false'
          # warn-on-below-threshold now defaults to true; pin it off so this job
          # stays as strict as it was — if clean-repo ever starts producing a
          # below-threshold finding, it should still red this job, not go green.
          warn-on-below-threshold: 'false'

  smoke-malicious:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: action
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/malicious-repo
          fail-on: high
          # Must be off, or this job fails on a comment 403 instead of on the
          # scan's exit code — a false pass that stops testing what it claims to.
          comment: 'false'
          telemetry: 'false'
      - name: Assert action failed
        if: steps.action.outcome != 'failure'
        run: |
          echo "Expected action to fail on malicious fixture, got outcome=${{ steps.action.outcome }}" >&2
          exit 1

  smoke-pr-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          path: tests/fixtures/malicious-repo
          fail-on: high
          comment: 'true'
          telemetry: 'false'
        continue-on-error: true
      - name: Assert sticky comment exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- skilltrust:action:v1 -->"))] | length')
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly 1 marker comment, got $count" >&2
            exit 1
          fi

  smoke-pr-delta:
    if: github.event_name == 'pull_request'
    # Serialized after smoke-pr-comment: both drive the same marker comment on
    # the same PR, so running them concurrently makes the "exactly 1" assertion
    # a coin flip. Running second also means this job exercises the PATCH
    # (sticky-update) path rather than a fresh POST.
    needs: smoke-pr-comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: action
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/malicious-repo
          fail-on: high
          delta: 'true'
          comment: 'true'
          telemetry: 'false'
      - name: Assert marker comment posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("<!-- skilltrust:action:v1 -->")) | .body' | head -1)
          if [ -z "$body" ]; then
            echo "Expected marker comment, got none" >&2
            exit 1
          fi

  # The only job that executes render-comment.ps1 and report.ps1. Both are
  # gated on `comment == 'true'` + PR + Windows, and every other Windows leg
  # passes comment: 'false' — for two recorded reasons that still hold, so do
  # not "fix" those legs instead of keeping this job:
  #   * without pull-requests: write the comment step 403s, and smoke-malicious
  #     passed anyway, which silently stopped testing exit-code propagation;
  #   * eight jobs driving the same sticky marker made smoke-pr-comment's
  #     "exactly 1" assertion a lottery.
  # Hence a dedicated job with its own permissions, chained last behind
  # smoke-pr-comment -> smoke-pr-delta so the marker is never driven
  # concurrently. Landing last also means it exercises the PATCH
  # (sticky-update) path rather than a fresh POST.
  #
  # It doubles as the end-to-end check for warn-on-below-threshold: fail-on
  # critical against malicious-repo yields engine exit 1 (SD-017 and SD-007 are
  # both HIGH, so below a critical threshold), which the input must turn into a
  # warning annotation and a passing job.
  smoke-pr-comment-windows:
    if: github.event_name == 'pull_request'
    needs: smoke-pr-delta
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Precondition, not decoration: the post-run assertion is "the body
      # changed", which proves nothing unless we know what it changed from.
      # Recording the id also lets us prove this run PATCHed the existing
      # comment rather than orphaning it and posting a new one.
      #
      # The discriminator is the FIXTURE, deliberately. An earlier version keyed
      # on smoke-pr-delta having rendered a delta table, which only happens when
      # some axis actually moved between base and head — i.e. only on PRs that
      # touch tests/fixtures/. On every other PR the delta is empty, the table
      # has no delta column, and the precondition failed for a reason that had
      # nothing to do with the code under test. Grade D -> grade A is under this
      # job's control and holds on every PR.
      - name: Record the comment smoke-pr-delta left behind
        id: before
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          body=$(gh api "$api" --jq '[.[] | select(.body | startswith("<!-- skilltrust:action:v1 -->"))][0].body')
          id=$(gh api "$api" --jq '[.[] | select(.body | startswith("<!-- skilltrust:action:v1 -->"))][0].id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "Expected smoke-pr-delta to have left a marker comment, found none" >&2
            exit 1
          fi
          # smoke-pr-delta scans malicious-repo at fail-on high, so its report
          # must carry a blocking threshold outcome. A clean body would make
          # the rewrite assertion vacuous.
          if ! printf '%s' "$body" | grep -qF -- 'SkillTrust check will fail — configured threshold reached'; then
            echo "Expected smoke-pr-delta's blocking body; the malicious-to-clean assertion would be vacuous" >&2
            printf '%s\n' "$body" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Executes render-comment.ps1 and report.ps1 — the whole point of the job.
      # clean-repo, so the comment must flip to a clean outcome: a change only
      # these two scripts could have made.
      - name: Comment from Windows (executes render-comment.ps1 + report.ps1)
        uses: ./
        with:
          path: tests/fixtures/clean-repo
          comment: 'true'
          delta: 'false'
          telemetry: 'false'

      - name: Assert the Windows comment steps actually rewrote the comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_ID: ${{ steps.before.outputs.id }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          count=$(gh api "$api" --jq '[.[] | select(.body | startswith("<!-- skilltrust:action:v1 -->"))] | length')
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly 1 marker comment, got $count" >&2
            exit 1
          fi
          id=$(gh api "$api" --jq '[.[] | select(.body | startswith("<!-- skilltrust:action:v1 -->"))][0].id')
          if [ "$id" != "$BEFORE_ID" ]; then
            echo "Expected the sticky PATCH path to reuse comment $BEFORE_ID, got $id" >&2
            exit 1
          fi
          body=$(gh api "$api" --jq '[.[] | select(.body | startswith("<!-- skilltrust:action:v1 -->"))][0].body')
          # If the Windows render/report steps had silently skipped, the body
          # would still carry smoke-pr-delta's blocking outcome.
          if ! printf '%s' "$body" | grep -qF -- 'Clean — no findings'; then
            echo "Comment body is not clean-repo's clean outcome; the Windows render/report steps did not run" >&2
            printf '%s\n' "$body" >&2
            exit 1
          fi

      # F-05 end to end on Windows: malicious-repo's findings are both HIGH, so
      # a critical threshold leaves them below it and the engine exits 1. With
      # the input on, propagate-exit.sh must turn that into a warning and let
      # the step pass. comment: 'false' so this does not disturb the assertion
      # above.
      - name: Assert warn-on-below-threshold passes on exit 1
        uses: ./
        with:
          path: tests/fixtures/malicious-repo
          fail-on: critical
          warn-on-below-threshold: 'true'
          comment: 'false'
          telemetry: 'false'
