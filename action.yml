name: SkillTrust Scan
description: Scan AI-agent config (SKILL.md, CLAUDE.md, .claude/, .mcp.json) for security threats
author: SkillTrust
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Path to scan (default = repo root)
    required: false
    default: '.'
  fail-on:
    description: >-
      Severity threshold for a non-zero exit: critical|high|medium|low|info.
      Defaults to `critical`, because that is what measurement supports:
      on engine v0.7.0 over 300 benign MalSkillBench samples in the raw
      layout a repository scan actually sees, `high` failed 75 of them
      (FPR 0.250) and `critical` failed 13 (FPR 0.043) — one clean
      repository in four, against one in twenty-three. HIGH findings are
      still reported, they just do not stop the build. Set `high` to opt
      into the stricter gate.
    required: false
    default: critical
  fail-on-axis:
    description: 'Per-axis grade thresholds, comma-separated, e.g. "permission_hygiene=C,security=C"'
    required: false
    default: ''
  strict-mcp:
    description: Raise MCP external-domain rule severity from medium to high
    required: false
    default: 'false'
  scan-all:
    description: Disable scope tightening and .gitignore filtering
    required: false
    default: 'false'
  comment:
    description: Post sticky PR comment (PR triggers only)
    required: false
    default: 'true'
  warn-on-below-threshold:
    description: >-
      Treat exit 1 (findings, all below the threshold) as a warning
      annotation instead of a build failure. Defaults to `true`: the engine
      already means exit 1 as "look, but I am not blocking you", so failing
      on it made every below-threshold finding as loud as a real breach.
      The findings still appear in the job log as a `::warning::` annotation,
      and on pull-request runs, in the sticky PR comment too. Set `false` to
      fail on them. Exit 2 (a threshold breach) and exit 3 (tool error) are
      never downgraded.
    required: false
    default: 'true'
  fail-on-no-agent-surface:
    description: Fail the build when the scan found no agent configuration files (default = warn only)
    required: false
    default: 'false'
  delta:
    description: Compute delta vs base branch (PR triggers only). Doubles runtime.
    required: false
    default: 'false'
  telemetry:
    description: Send anonymous install heartbeat to skilltrust.app (no findings, no paths)
    required: false
    default: 'true'
  github-token:
    description: Token for posting PR comments. Default = workflow GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  detector-version:
    description: Pin a specific skill-detector release. Default = version pinned to this action tag.
    required: false
    default: 'v0.7.0'

outputs:
  grade:
    description: 'Overall trust grade (worst axis): A|B|C|D|F'
    value: ${{ steps.scan.outputs.grade }}
  scan-json-path:
    description: Absolute path to the scan result JSON in the runner
    value: ${{ steps.scan.outputs.scan-json-path }}
  findings-count:
    description: Total finding count
    value: ${{ steps.scan.outputs.findings-count }}
  no-agent-surface:
    description: 'true when the scan found no agent configuration files — no grade was produced'
    value: ${{ steps.scan.outputs.no-agent-surface }}

runs:
  using: composite
  steps:
    - name: Install skill-detector
      shell: bash
      if: runner.os != 'Windows'
      env:
        INPUT_DETECTOR_VERSION: ${{ inputs.detector-version }}
      run: ${{ github.action_path }}/scripts/install.sh

    - name: Install skill-detector (Windows)
      shell: pwsh
      if: runner.os == 'Windows'
      env:
        INPUT_DETECTOR_VERSION: ${{ inputs.detector-version }}
      run: ${{ github.action_path }}/scripts/install.ps1

    - id: scan
      name: Run scan
      shell: bash
      if: runner.os != 'Windows'
      env:
        INPUT_PATH:         ${{ inputs.path }}
        INPUT_FAIL_ON:      ${{ inputs.fail-on }}
        INPUT_FAIL_ON_AXIS: ${{ inputs.fail-on-axis }}
        INPUT_STRICT_MCP:   ${{ inputs.strict-mcp }}
        INPUT_SCAN_ALL:     ${{ inputs.scan-all }}
      run: ${{ github.action_path }}/scripts/scan.sh

    - id: scan-win
      name: Run scan (Windows)
      shell: pwsh
      if: runner.os == 'Windows'
      env:
        INPUT_PATH:         ${{ inputs.path }}
        INPUT_FAIL_ON:      ${{ inputs.fail-on }}
        INPUT_FAIL_ON_AXIS: ${{ inputs.fail-on-axis }}
        INPUT_STRICT_MCP:   ${{ inputs.strict-mcp }}
        INPUT_SCAN_ALL:     ${{ inputs.scan-all }}
      run: ${{ github.action_path }}/scripts/scan.ps1

    - id: delta
      name: Compute delta
      shell: bash
      if: inputs.delta == 'true' && github.event_name == 'pull_request' && runner.os != 'Windows'
      env:
        INPUT_BASE_REF:        ${{ github.event.pull_request.base.ref }}
        INPUT_HEAD_SCAN_JSON:  ${{ steps.scan.outputs.scan-json-path }}
        INPUT_PATH:            ${{ inputs.path }}
      run: ${{ github.action_path }}/scripts/delta.sh

    - id: delta-win
      name: Compute delta (Windows)
      shell: pwsh
      if: inputs.delta == 'true' && github.event_name == 'pull_request' && runner.os == 'Windows'
      env:
        INPUT_BASE_REF:        ${{ github.event.pull_request.base.ref }}
        INPUT_HEAD_SCAN_JSON:  ${{ steps.scan-win.outputs.scan-json-path }}
        INPUT_PATH:            ${{ inputs.path }}
      run: ${{ github.action_path }}/scripts/delta.ps1

    - name: Render comment
      shell: bash
      if: github.event_name == 'pull_request' && inputs.comment == 'true' && runner.os != 'Windows'
      env:
        INPUT_SCAN_JSON:  ${{ steps.scan.outputs.scan-json-path }}
        INPUT_DELTA_JSON: ${{ env.SCAN_ACTION_DELTA_JSON }}
      run: ${{ github.action_path }}/scripts/render-comment.sh

    - name: Render comment (Windows)
      shell: pwsh
      if: github.event_name == 'pull_request' && inputs.comment == 'true' && runner.os == 'Windows'
      env:
        INPUT_SCAN_JSON:  ${{ steps.scan-win.outputs.scan-json-path }}
        INPUT_DELTA_JSON: ${{ env.SCAN_ACTION_DELTA_JSON }}
      run: ${{ github.action_path }}/scripts/render-comment.ps1

    - name: Post sticky comment
      shell: bash
      if: github.event_name == 'pull_request' && inputs.comment == 'true' && runner.os != 'Windows'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_GITHUB_REPOSITORY: ${{ github.repository }}
        INPUT_PULL_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
      run: ${{ github.action_path }}/scripts/report.sh

    - name: Post sticky comment (Windows)
      shell: pwsh
      if: github.event_name == 'pull_request' && inputs.comment == 'true' && runner.os == 'Windows'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_GITHUB_REPOSITORY: ${{ github.repository }}
        INPUT_PULL_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
      run: ${{ github.action_path }}/scripts/report.ps1

    - name: Send telemetry
      shell: bash
      if: inputs.telemetry == 'true' && runner.os != 'Windows'
      env:
        INPUT_SCAN_JSON:        ${{ steps.scan.outputs.scan-json-path }}
        # Keep in sync with the release tag — see docs/runbooks/release.md
        INPUT_ACTION_VERSION:   1.7.0
        INPUT_DETECTOR_VERSION: ${{ inputs.detector-version }}
        INPUT_DELTA_ENABLED:    ${{ inputs.delta }}
      run: ${{ github.action_path }}/scripts/telemetry.sh

    - name: Send telemetry (Windows)
      shell: pwsh
      if: inputs.telemetry == 'true' && runner.os == 'Windows'
      env:
        INPUT_SCAN_JSON:        ${{ steps.scan-win.outputs.scan-json-path }}
        # Keep in sync with the release tag — see docs/runbooks/release.md
        INPUT_ACTION_VERSION:   1.7.0
        INPUT_DETECTOR_VERSION: ${{ inputs.detector-version }}
        INPUT_DELTA_ENABLED:    ${{ inputs.delta }}
      run: ${{ github.action_path }}/scripts/telemetry.ps1

    # bash on every OS (Git Bash on Windows), so deliberately not a .ps1 pair —
    # see the header comment in the script.
    - name: Propagate exit code
      shell: bash
      env:
        INPUT_WARN_ON_BELOW_THRESHOLD:   ${{ inputs.warn-on-below-threshold }}
        INPUT_GRADE:                     ${{ steps.scan.outputs.grade || steps.scan-win.outputs.grade }}
        INPUT_FINDINGS_COUNT:            ${{ steps.scan.outputs.findings-count || steps.scan-win.outputs.findings-count }}
        INPUT_NO_AGENT_SURFACE:          ${{ steps.scan.outputs.no-agent-surface || steps.scan-win.outputs.no-agent-surface }}
        INPUT_FAIL_ON_NO_AGENT_SURFACE:  ${{ inputs.fail-on-no-agent-surface }}
      run: |
        # github.action_path is a Windows path (D:\a\...) on Windows runners,
        # and this step is `shell: bash` on every OS. Interpolating it straight
        # into the script body lets bash eat the backslashes as escapes, so the
        # path arrives as "D:ascan-actionscan-action" and the step exits 127.
        # Read it from the env instead and normalise the separators.
        script="${GITHUB_ACTION_PATH//\\//}/scripts/propagate-exit.sh"
        bash "$script"
